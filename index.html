<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فريدة جاليري | Farida Gallery</title>
<meta name="description" content="فريدة جاليري – كل حاجة بتصميمك ليها طابع مميز">
<meta property="og:title" content="فريدة جاليري | Farida Gallery">
<meta property="og:description" content="كل حاجة بتصميمك ليها طابع مميز">
<meta property="og:type" content="website">
<meta property="og:image" content="images/1.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#4a0416; --wine-2:#6b1228; --paper:#fbf6f4; --ink:#2b0a12; --muted:#7a5560; --line:#e6d3d6;
    --display:'Aref Ruqaa',serif; --body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.7}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--wine-2);outline-offset:3px}

  /* Hero: the logo's circle is the one memorable element */
  .hero{background:var(--wine);color:var(--paper);min-height:78vh;display:grid;place-items:center;padding:32px 16px}
  .ring{width:min(78vw,440px);aspect-ratio:1;border:3px solid var(--paper);border-radius:50%;display:grid;place-content:center;text-align:center;gap:4px;padding:24px}
  .ring h1{font-family:var(--display);font-size:clamp(64px,16vw,112px);line-height:1.1;font-weight:700}
  .ring .en{letter-spacing:.5em;font-size:clamp(16px,4vw,24px);margin-inline-start:.5em;font-family:Georgia,serif}
  .ring .sub{font-style:italic;font-family:Georgia,serif;opacity:.85;font-size:clamp(14px,3.4vw,19px)}
  .tag{margin-top:28px;text-align:center;opacity:.9;font-size:clamp(15px,3.6vw,18px)}
  .hero-in{display:grid;place-items:center}

  main{max-width:1120px;margin:0 auto;padding:64px 20px}
  .head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .head h2{font-family:var(--display);font-size:clamp(30px,6vw,42px);color:var(--wine)}
  .section + .section{margin-top:56px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{font:inherit;font-size:15px;padding:6px 16px;border:1px solid var(--wine);background:transparent;color:var(--wine);border-radius:999px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--wine);color:var(--paper)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 22px;list-style:none;padding:0}
  .card .ph{aspect-ratio:4/3;background:var(--wine);overflow:hidden;display:grid;place-items:center;border-radius:2px 2px 90px 2px;cursor:zoom-in}
  .card img{width:100%;height:100%;object-fit:cover;display:block}

  /* Lightbox */
  .lb{position:fixed;inset:0;z-index:50;background:rgba(43,10,18,.95);display:grid;place-items:center;padding:56px 16px 72px}
  .lb[hidden]{display:none}
  .lb img{max-width:min(100%,960px);max-height:82vh;object-fit:contain;border-radius:4px;background:var(--wine)}
  .lb button{position:absolute;background:transparent;border:0;color:var(--paper);cursor:pointer;font:inherit;line-height:1}
  .lb-x{top:14px;inset-inline-start:16px;font-size:40px;padding:4px 12px;opacity:.85}
  .lb-arrow{top:50%;transform:translateY(-50%);font-size:48px;padding:8px 14px;opacity:.75}
  .lb-arrow:hover,.lb-x:hover{opacity:1}
  .lb-prev{inset-inline-start:8px}
  .lb-next{inset-inline-end:8px}
  .lb-cap{position:absolute;bottom:20px;inset-inline:0;text-align:center;color:var(--paper);font-size:15px;opacity:.9;padding:0 16px}
  .card .ph.empty{color:var(--paper);font-family:var(--display);font-size:56px}
  .card h3{font-size:18px;font-weight:600;margin-top:12px}
  .card p{color:var(--muted);font-size:15px;white-space:pre-line}
  .card .foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:6px}
  .card .price{font-weight:600;color:var(--wine-2);font-size:17px}
  .card .order{font-size:14px;text-decoration:none;border:1px solid var(--wine);color:var(--wine);padding:4px 14px;border-radius:999px;white-space:nowrap}
  .card .order:hover{background:var(--wine);color:var(--paper)}

  footer{background:var(--wine);color:var(--paper);text-align:center;padding:48px 20px}
  footer h2{font-family:var(--display);font-size:30px;margin-bottom:8px}
  footer .links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  footer .links a{border:1px solid var(--paper);padding:8px 22px;border-radius:999px;text-decoration:none}
  footer .links a:hover{background:var(--paper);color:var(--wine)}
  footer small{display:block;margin-top:28px;opacity:.7}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-in">
    <div class="ring">
      <h1>فريدة</h1>
      <div class="en">FARIDA</div>
      <div class="sub">— Gallery —</div>
    </div>
    <p class="tag">كل حاجة بتصميمك ليها طابع مميز</p>
  </div>
</header>

<main id="products">
  <div id="sections"></div>
</main>

<footer id="contact">
  <h2>عايز تطلب أو تسأل؟</h2>
  <p>كلمنا وهنرد عليك في أقرب وقت.</p>
  <div class="links">
    <a id="wa-link" href="https://wa.me/201000000000" target="_blank" rel="noopener">واتساب</a>
    <a href="https://www.facebook.com/Farida.gallery.EG/" target="_blank" rel="noopener">فيسبوك</a>
  </div>
  <small>فريدة جاليري — Made with Love</small>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="صورة المنتج" hidden>
  <button class="lb-x" id="lb-x" aria-label="إغلاق">×</button>
  <button class="lb-arrow lb-prev" id="lb-prev" aria-label="المنتج السابق">›</button>
  <img id="lb-img" alt="">
  <button class="lb-arrow lb-next" id="lb-next" aria-label="المنتج التالي">‹</button>
  <div class="lb-cap" id="lb-cap"></div>
</div>

<script>
/* ============ عدّل المنتجات من هنا ============
   name: اسم المنتج | price: السعر | desc: وصف قصير
   img: مسار الصورة (الصور في فولدر images) | cat: التصنيف
   لو الصورة مش موجودة هيظهر مربع بوردو بدالها. */

const WHATSAPP = "201000000000"; /* ← رقم الواتساب بالكود الدولي بدون + (مثال: 201012345678) */

const PRODUCTS = [
  {
    name: "بوكس شنطة توتي باج",
    price: "350 جنيه",
    desc: "شنطة توتي باج بسوستة وباوتش ومج من تصميمك، مع اتنين مدالية هاند ميد من تصميمك، في بوكس شيك.",
    img: "images/1.jpg",
    cat: "عروض"
  },
  {
    name: "بوكس تابلوه وفوتو بوك",
    price: "350 جنيه",
    desc: "تابلوه كبير وفوتو بوك خشب A5 يشيل 8 صور، مع اتنين مدالية هاند ميد من تصميمك، في بوكس شيك.",
    img: "images/2.jpg",
    cat: "عروض"
  },
  {
    name: "بوكس تابلوهات وفوتو بوك",
    price: "380 جنيه",
    desc: "تابلوه كبير واتنين تابلوه أصغر وفوتو بوك خشب يشيل 8 صور، في بوكس شيك.",
    img: "images/3.jpg",
    cat: "عروض"
  },

  /* منتجات عامة — عدّل الاسم والسعر من هنا */
  { name: "مريلة مطبخ بتصميمك", price: "350 جنيه", desc: "خامة دك ووتر بروف", img: "images/4.jpg", cat: "منتجات" },
  { name: "باوتش بتصميمك", price: "70 جنيه", desc: "", img: "images/5.jpg", cat: "منتجات" },
  { name: "مج ملون بتصميمك", price: "150 جنيه", desc: "", img: "images/8.jpg", cat: "منتجات" },
  { name: "تابلوه وميداليه", price: "100 جنيه", desc: "تابلوه خشب استاند وميدالية أكلريك", img: "images/10.jpg", cat: "منتجات" },
  { name: "مج أبيض بتصميمك", price: "120 جنيه", desc: "", img: "images/89.jpg", cat: "منتجات" },
  { name: "فوتو بوك خشب", price: "من 120 جنيه", desc: "8 صور مطبوعين على خشب\nمقاس 20×30 — 250 جنيه\nمقاس 21×15 — 150 جنيه\nمقاس 10×15 — 120 جنيه", img: "images/99.jpg", cat: "منتجات" },
  { name: "ميدالية خشب بتصميمك", price: "30 جنيه", desc: "ميدالية خشب بوجهين", img: "images/999.jpg", cat: "منتجات" }
];
/* ============================================== */

/* ترتيب الأقسام على الصفحة */
const SECTIONS = ["عروض", "منتجات"];

let visible = [];

function orderLink(p){
  const text = encodeURIComponent(`عايز أطلب: ${p.name}${p.price ? ' - ' + p.price : ''}`);
  return `https://wa.me/${WHATSAPP}?text=${text}`;
}

function cardFor(p, i){
  const li = document.createElement('li');
  li.className = 'card';

  const ph = document.createElement('div');
  ph.className = 'ph';
  ph.tabIndex = 0;
  ph.setAttribute('role', 'button');
  ph.setAttribute('aria-label', `تكبير صورة ${p.name}`);
  ph.onclick = () => openLb(i);
  ph.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLb(i); } };
  const img = new Image();
  img.alt = p.name; img.loading = 'lazy'; img.src = p.img;
  img.onerror = () => { img.remove(); ph.classList.add('empty'); ph.textContent = 'ف'; };
  ph.appendChild(img);
  li.appendChild(ph);

  li.insertAdjacentHTML('beforeend', `<h3></h3><p></p><div class="foot"><div class="price"></div></div>`);
  li.querySelector('h3').textContent = p.name;
  li.querySelector('p').textContent = p.desc || '';
  li.querySelector('.price').textContent = p.price || 'اسأل عن السعر';

  const a = document.createElement('a');
  a.className = 'order';
  a.href = orderLink(p);
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = 'اطلب على واتساب';
  li.querySelector('.foot').appendChild(a);

  return li;
}

function render(){
  const root = document.getElementById('sections');
  root.innerHTML = '';
  visible = [];

  SECTIONS.forEach(cat => {
    const items = PRODUCTS.filter(p => p.cat === cat);
    if (!items.length) return;

    const section = document.createElement('section');
    section.className = 'section';
    section.innerHTML = `<div class="head"><h2></h2></div><ul class="grid"></ul>`;
    section.querySelector('h2').textContent = cat;

    const ul = section.querySelector('.grid');
    items.forEach(p => {
      const i = visible.push(p) - 1;
      ul.appendChild(cardFor(p, i));
    });
    root.appendChild(section);
  });
}

/* ===== Lightbox ===== */
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
const lbCap = document.getElementById('lb-cap');
let lbIndex = 0;
let lastFocus = null;

function showLb(i){
  lbIndex = (i + visible.length) % visible.length;
  const p = visible[lbIndex];
  lbImg.src = p.img;
  lbImg.alt = p.name;
  lbCap.textContent = `${p.name} — ${p.price || ''}`;
}

function openLb(i){
  lastFocus = document.activeElement;
  showLb(i);
  lb.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('lb-x').focus();
}

function closeLb(){
  lb.hidden = true;
  lbImg.removeAttribute('src');
  document.body.style.overflow = '';
  if (lastFocus) lastFocus.focus();
}

document.getElementById('lb-x').onclick = closeLb;
document.getElementById('lb-prev').onclick = () => showLb(lbIndex - 1);
document.getElementById('lb-next').onclick = () => showLb(lbIndex + 1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (lb.hidden) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowRight') showLb(lbIndex - 1);
  else if (e.key === 'ArrowLeft') showLb(lbIndex + 1);
});

document.getElementById('wa-link').href = `https://wa.me/${WHATSAPP}`;
render();
</script>
</body>
</html>
